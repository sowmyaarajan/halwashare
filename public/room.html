<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d1917">
  <title>HalwaShare — room</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="room-page">

  <div id="offline-banner" class="offline-banner hidden">Connection lost — reconnecting…</div>

  <header class="room-header">
    <a class="header-brand" href="/" title="Leave room">
      <span class="brand-mark-sm">🍮</span>
      <span class="header-name">HalwaShare</span>
    </a>

    <button id="header-code" class="code-pill" title="Copy room code">----</button>

    <div class="header-tools">
      <button id="btn-sound" class="icon-btn" title="Toggle sound">🔔</button>
      <button class="icon-btn" data-theme-btn title="Toggle dark mode">🌙</button>
      <button id="btn-exit" class="btn btn-ghost btn-sm">Leave</button>
    </div>
  </header>

  <div class="room-body">

    <aside class="sidebar">
      <section class="side-block">
        <h2 class="side-title">In this room <span id="user-count" class="count">1</span></h2>
        <ul id="user-list" class="user-list"></ul>
      </section>

      <section class="side-block">
        <h2 class="side-title">Invite</h2>
        <img id="qr-img" class="qr hidden" alt="QR code to join this room">
        <p id="share-link" class="share-link"></p>
        <button id="btn-copy-link" class="btn btn-secondary btn-block btn-sm">Copy link</button>
      </section>

      <p id="caps-note" class="caps-note"></p>
    </aside>

    <main class="chat-area">
      <div class="messages-wrap">
        <div id="messages" class="messages"></div>

        <div id="empty-state" class="empty-state">
          <div class="empty-art">📦</div>
          <h3>Drop a file to get started</h3>
          <p>Any size — a photo, a folder of videos, a disk image.<br>
             Sharing is instant; the bytes move when someone downloads.</p>
        </div>
      </div>

      <div id="typing-indicator" class="typing-indicator hidden"></div>

      <div id="drop-overlay" class="drop-overlay hidden">
        <div class="drop-inner">
          <span>📂</span>
          <p>Release to share with everyone here</p>
        </div>
      </div>

      <div class="composer">
        <label for="file-input" class="icon-btn attach" title="Attach files">📎</label>
        <input type="file" id="file-input" class="hidden" multiple>
        <input id="msg-input" class="msg-input" type="text" maxlength="4000"
               placeholder="Write a message, or paste a screenshot…" autocomplete="off">
        <button id="btn-send" class="btn btn-primary">Send</button>
      </div>
    </main>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
